<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع موكسيرا فارما الرسمي | Moxyra Pharma</title>
    <!-- Bootstrap RTL CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0b1a30 0%, #0056b3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .coming-soon-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 50px 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .badge-status {
            background-color: #00a896;
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 25px;
        }
        .title {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #e0e6ed;
            margin-bottom: 35px;
            line-height: 1.8;
        }
        .contact-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        .contact-btn {
            background-color: #25d366;
            color: #fff;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px 25px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .contact-btn:hover {
            background-color: #1eb954;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="coming-soon-card">
        <div class="badge-status">
            <i class="fa-solid fa-gears me-2"></i> قريباً جداً
        </div>
        
        <h1 class="title">Moxyra Pharma | موكسيرا فارما</h1>
        
        <p class="subtitle">
            نعمل حالياً على تجهيز الموقع الرسمي لشركة موكسيرا فارما لتقديم تجربة متكاملة واستعراض أحدث مستحضرات التجميل العالية الفعالية والمكملات الغذائية متقدمة الجودة.
        </p>

        <div class="contact-box">
            <p class="mb-3 fs-6">للتواصل المباشر والاستفسارات التجارية:</p>
            <a href="https://wa.me/" class="contact-btn" target="_blank">
                <i class="fa-brands fa-whatsapp fs-5"></i> تواصل معنا عبر واتساب
            </a>
        </div>
    </div>

</body>
</html>
